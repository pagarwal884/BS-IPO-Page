<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - Bluestock</title>
  <link rel="stylesheet" href="reset.css">
</head>

<body>
  <div class="container">
    <div class="logo">
      <div class="logo-text">BLUESTOCK</div>
    </div>

    <h1>Forgot Password?</h1>
    <p class="subtitle">
      Enter your email address to get the password reset link.
    </p>

    <div class="success-message" id="successMessage">
      Password reset link has been sent to your email address.
    </div>

    <div class="error-message" id="errorMessage">
      Please enter a valid email address.
    </div>

    <form id="resetForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="hello@bluestock.in" required />
      </div>

      <button type="submit" class="reset-btn" id="resetBtn">
        <span id="btnText">Password Reset</span>
        <span class="loading" id="loading" style="display: none"></span>
      </button>
    </form>

    <a href="#" class="back-link" onclick="goBack()">Back to login</a>
  </div>

  
</body>

</html>
