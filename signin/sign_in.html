<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to Bluestock</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="signin.css">

</head>

<body>
    <div class="login-container">
        <div class="logo-container">
            <img src="./clogo.png" alt="Bluestock Logo">
        </div>

        <h1 class="form-title">Welcome back</h1>
        <p class="form-subtitle">Sign in to access your Bluestock account</p>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="emailInput">
                    <i class="fas fa-envelope"></i> Email Address
                </label>
                <div class="position-relative">
                    <i class="fas fa-user input-icon"></i>
                    <input type="email" class="form-control" id="emailInput" placeholder="jhondoe@gmail.com" required>
                </div>
            </div>

            <div class="form-group">
                <div class="password-header">
                    <label class="form-label" for="passwordInput">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>
                <div class="position-relative">
                    <i class="fas fa-key input-icon"></i>
                    <input type="password" class="form-control" id="passwordInput" placeholder="*************" required>
                </div>
            </div>

            <div class="g-recaptcha" data-sitekey="6LeDQD8rAAAAAJSatKqYX3g4o3Esrr06p8XmFyBc"></div>

            <div class="remember-me">
                <input type="checkbox" class="form-check-input" id="keepSignedIn">
                <label for="keepSignedIn">Keep me signed in</label>
            </div>

            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <div class="divider">
            <span>or sign in with</span>
        </div>

        <button class="btn-google">
            <img src="./Group.png" alt="Google Logo">
            Continue with Google
        </button>

        <div class="create-account">
            Don't have an account? <a href="#">Create an account</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="sign_in.js"></script>
</body>

</html>
